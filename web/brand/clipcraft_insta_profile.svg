<svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E1726"/>
      <stop offset="65%" stop-color="#05080E"/>
      <stop offset="100%" stop-color="#020306"/>
    </radialGradient>
    <linearGradient id="cyanCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="45%" stop-color="#00B4D8"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="neonAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#90F7FF"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="35" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ringGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1080" height="1080" fill="url(#bg)"/>

  <!-- Cyber Ring Borders (Safe-Zone Circular Guide for Instagram Profile) -->
  <circle cx="540" cy="540" r="500" stroke="rgba(0, 240, 255, 0.06)" stroke-width="2" stroke-dasharray="8 12"/>
  <circle cx="540" cy="540" r="460" stroke="rgba(0, 240, 255, 0.22)" stroke-width="4" filter="url(#ringGlow)"/>
  <circle cx="540" cy="540" r="448" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Subtle Cyber Tick Marks around the Ring -->
  <line x1="540" y1="65" x2="540" y2="92" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>
  <line x1="540" y1="988" x2="540" y2="1015" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>
  <line x1="65" y1="540" x2="92" y2="540" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>
  <line x1="988" y1="540" x2="1015" y2="540" stroke="#00F0FF" stroke-width="3" opacity="0.6"/>

  <!-- Center Ambient Glow -->
  <circle cx="540" cy="540" r="280" fill="#00E5FF" opacity="0.14" filter="url(#outerGlow)"/>

  <!-- Central ClipCraft Monogram Emblem (Safe Zone within 650x650) -->
  <g transform="translate(540, 540)" filter="url(#outerGlow)">
    <!-- First 'C' Wing (Left) -->
    <path d="M -80 -180 C -180 -180 -260 -100 -260 0 C -260 100 -180 180 -80 180 C -25 180 25 155 60 115 L 0 70 C -20 95 -45 110 -80 110 C -135 110 -180 65 -180 0 C -180 -65 -135 -110 -80 -110 C -45 -110 -20 -95 0 -70 L 60 -115 C 25 -155 -25 -180 -80 -180 Z" fill="url(#cyanCore)"/>

    <!-- High-Precision Diamond Play Blade / Second 'C' Interlock -->
    <path d="M 45 -140 L 255 0 L 45 140 Z" fill="url(#neonAccent)"/>
    <path d="M 80 -85 L 205 0 L 80 85 Z" fill="#05080E"/>
    <path d="M 110 -45 L 175 0 L 110 45 Z" fill="url(#cyanCore)"/>

    <!-- Bright Focal Sparkle -->
    <circle cx="255" cy="0" r="8" fill="#FFFFFF" filter="drop-shadow(0 0 12px #00F0FF)"/>
  </g>

  <!-- Sleek Bottom Subtitle Text inside circular safe area -->
  <text x="540" y="870" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="14" fill="#FFFFFF">CLIPCRAFT</text>
  <text x="540" y="905" text-anchor="middle" font-family="'Geist', 'Segoe UI', system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="8" fill="#00E5FF" opacity="0.85">AI STUDIO</text>
</svg>