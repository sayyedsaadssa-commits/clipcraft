  <g filter="url(#glow)">
    <!-- First 'C' curve -->
    <path d="M 118 76 C 85 76 66 98 66 128 C 66 158 85 180 118 180 C 132 180 144 174 150 166 L 134 152 C 130 156 125 159 118 159 C 100 159 89 146 89 128 C 89 110 100 97 118 97 C 125 97 130 100 134 104 L 150 90 C 144 82 132 76 118 76 Z" fill="url(#cyanGrad)"/>
    <!-- Overlapping Play / Craft Diamond Shape -->
    <path d="M 148 94 L 196 128 L 148 162 Z" fill="#FFFFFF"/>
    <path d="M 160 112 L 184 128 L 160 144 Z" fill="url(#cyanGrad)"/>
