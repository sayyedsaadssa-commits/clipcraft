<svg width="520" height="120" viewBox="0 0 520 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cyanTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00B4D8" />
    </linearGradient>
    <linearGradient id="cyanSymGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077B6" />
    </linearGradient>
    <filter id="symGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(10, 15)">
    <!-- Rounded Background Tile -->
    <rect width="90" height="90" rx="24" fill="#0C141E" stroke="#00E5FF" stroke-width="2" stroke-opacity="0.4"/>
    <!-- Stylized Cutting / Play Craft Icon -->
    <g filter="url(#symGlow)">
      <path d="M 42 28 C 30 28 22 36 22 47 C 22 58 30 66 42 66 C 47 66 52 64 54 61 L 48 55 C 46 57 44 58 42 58 C 34 58 30 53 30 47 C 30 41 34 36 42 36 C 44 36 46 37 48 39 L 54 33 C 52 30 47 28 42 28 Z" fill="url(#cyanSymGrad)"/>
      <path d="M 52 35 L 72 47 L 52 59 Z" fill="#FFFFFF"/>
      <path d="M 57 41 L 67 47 L 57 53 Z" fill="url(#cyanSymGrad)"/>
    </g>
  </g>

  <!-- Wordmark "ClipCraft" -->
  <text x="118" y="74" font-family="'Geist', 'Poppins', 'Segoe UI', system-ui, sans-serif" font-weight="800" font-size="46" letter-spacing="-1">
    <tspan fill="#F0F8FF">Clip</tspan><tspan fill="url(#cyanTextGrad)">Craft</tspan>
  </text>
  
  <!-- Small Tech Subtitle/Badge -->
  <rect x="365" y="47" width="92" height="20" rx="6" fill="rgba(0, 229, 255, 0.12)" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
  <text x="411" y="61" text-anchor="middle" font-family="'Geist', 'Segoe UI', sans-serif" font-weight="700" font-size="10" fill="#00E5FF" letter-spacing="1.5">STUDIO</text>
</svg>